<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NAY | Training System</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#141414;background:#f2f3f5}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(120deg,#090909 0%,#171717 48%,#080808 100%);color:white;padding:22px max(20px,3vw);display:flex;align-items:center;gap:36px;border-bottom:5px solid #cf080b}.logo{font-size:58px;font-weight:1000;letter-spacing:-6px;font-style:italic;line-height:1}.logo span{color:#f10d16}.tag{font-size:10px;letter-spacing:4px;margin-top:4px}.jp{color:white;border-left:3px solid #ed1017;border-right:3px solid #ed1017;padding:6px 12px;font-size:21px}.hero h1{font-size:clamp(18px,2.3vw,30px);margin:0;text-transform:uppercase}.nav{display:flex;gap:7px;padding:9px 14px;background:white;overflow-x:auto;border-bottom:1px solid #ddd}.nav button{border:0;background:#f0f0f0;padding:13px 20px;white-space:nowrap;cursor:pointer;font-weight:700;flex:1;border-radius:3px}.nav button.active{background:#d4080c;color:white}.container{padding:16px;max-width:1800px;margin:auto}.filters{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr)) 1.5fr;gap:12px;align-items:end;margin-bottom:18px}.filters label{font-weight:bold;font-size:13px;display:block;margin-bottom:6px}.filters select{width:100%;padding:11px;border:1px solid #aaa;background:#fff;border-radius:4px}.summary{background:#d10b0f;color:white;border-radius:5px;text-align:center;padding:12px;font-weight:800}.summary small{display:block;background:#090909;margin:-12px -12px 10px;padding:9px;font-size:13px}.layout{display:grid;grid-template-columns:1.8fr 1fr;gap:18px}.panel{background:white;border:1px solid #ccc;border-radius:7px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 2px #0001}.panel h2{background:#080808;color:white;margin:0;padding:12px 18px;font-size:17px;text-transform:uppercase;border-left:12px solid #d40009}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}th{background:#bb090d;color:white}td,th{border:1px solid #c9c9c9;padding:10px;text-align:center}td:nth-child(2){text-align:left;font-weight:600}td input{width:74px;padding:7px;border:1px solid #ccc;border-radius:4px;text-align:center}td input.exercise{width:100%;min-width:165px;text-align:left}tfoot td{background:#111;color:white;font-weight:bold}tfoot td:last-child{background:#cf080d}.bottom{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.notes{padding:14px 20px}.notes label{display:block;padding:8px;border-bottom:1px solid #eee}.notes input{accent-color:#d10b0f}.progress{padding:15px}.progress label{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ddd}.progress input{width:90px;padding:5px}.progress strong{color:#16803b}.bars{padding:15px 20px}.bar{display:grid;grid-template-columns:100px 1fr 35px;align-items:center;gap:8px;margin:10px 0;font-size:13px}.track{background:#e5e5e5;height:19px}.fill{height:100%;background:#777}.bar:first-child .fill{background:#d5080b}.chart{padding:14px}.chart svg{width:100%;height:auto}.muted{color:#777;font-size:12px}.placeholder{padding:26px}.placeholder p{line-height:1.6}.placeholder button,.add{background:#d1080c;color:white;border:0;border-radius:4px;padding:10px 15px;cursor:pointer;font-weight:bold}.add{margin:12px}.foot{color:#777;text-align:center;font-size:12px;padding:18px}.stat{display:flex;gap:12px;flex-wrap:wrap}.stat div{background:#f2f2f2;padding:15px;flex:1;min-width:130px;border-radius:5px}.stat b{display:block;font-size:24px;color:#d1080c} @media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}.summary{grid-column:1/-1}.layout{grid-template-columns:1fr}.hero{gap:18px}.jp{display:none}}@media(max-width:580px){.hero{padding:18px}.logo{font-size:46px}.tag{font-size:8px;letter-spacing:2px}.hero h1{font-size:16px}.container{padding:10px}.filters{gap:8px}.panel h2{font-size:15px}.bottom{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr 28px}}

/* v1.1: desktop dashboard fidelity and responsive navigation */
.hero{min-height:145px;padding:22px clamp(18px,3vw,48px);background:linear-gradient(115deg,#070707,#171717 52%,#050505);gap:clamp(16px,3vw,46px)}
.logo{font-size:clamp(52px,5vw,82px)}.tag{font-size:clamp(8px,.8vw,12px)}.hero h1{font-size:clamp(20px,2.3vw,36px);line-height:1.12}.jp{font-size:25px}
.nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;padding:10px 18px}.nav button{min-width:0;padding:14px 5px;font-size:clamp(11px,.9vw,15px)}
.container{max-width:1920px;padding:18px clamp(14px,1.5vw,26px)}.layout{grid-template-columns:minmax(0,1.9fr) minmax(300px,.95fr);align-items:start;gap:22px}.layout>section,.layout>aside{min-width:0}
.panel{box-shadow:0 1px 3px #0002}.panel h2{font-size:clamp(15px,1.2vw,20px);padding:13px 18px}.filters{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(260px,1.45fr);gap:14px}
.scroll table{min-width:760px}td,th{padding:9px 7px}td input{max-width:100%}td input.exercise{min-width:135px}.bottom{grid-template-columns:1.2fr .9fr}.bar{grid-template-columns:95px 1fr 30px}
@media(max-width:1180px){.layout{grid-template-columns:1fr}.layout>aside{display:grid;grid-template-columns:1fr 1fr;gap:16px}.filters{grid-template-columns:repeat(4,minmax(0,1fr))}.summary{grid-column:1/-1}.nav{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:740px){.hero{min-height:110px;gap:14px;padding:16px}.hero h1{font-size:clamp(14px,3.2vw,21px)}.logo{font-size:49px}.jp{display:none}.nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px}.nav button{font-size:11px;padding:12px 3px;white-space:normal}.filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.filters select{font-size:12px}.layout>aside{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}.scroll table{min-width:760px}.container{padding:10px}.summary{font-size:13px}}
@media(max-width:390px){.hero h1{font-size:13px}.logo{font-size:40px}.tag{letter-spacing:1px}.nav{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><header class="hero"><div><div class="logo">N<span>A</span>Y</div><div class="tag">PERSONAL TRAINING</div></div><div class="jp">生き甲斐</div><h1>Planificación y seguimiento<br>del entrenamiento</h1></header><nav class="nav" id="nav"></nav><main class="container" id="main"></main><footer class="foot">NAY Personal Training · Prototipo local v1.2 · Los datos se guardan cuando el navegador lo permite · Cálculos estimados según el límite inferior del rango</footer><script>
const tabs=['Inicio','Rutinas','Progresión','Volumen','Planificación','Evaluación','Configuración'];const icons=['⌂','▣','▥','▰','▦','♙','⚙'];let tab='Rutinas';const base=[['Sentadilla Hack',3,'8–10',80,'Cuádriceps'],['Prensa de Piernas',3,'10–12',160,'Cuádriceps'],['Extensión de Rodilla',3,'12–15',55,'Cuádriceps'],['Sentadilla Goblet',2,'12–15',24,'Cuádriceps'],['Zancada en Máquina',2,'10–12',40,'Cuádriceps'],['Sissy Squat (o alternativa)',2,'15–20',0,'Cuádriceps']];const groups=['Cuádriceps','Femoral','Glúteos','Espalda','Pecho','Hombros','Bíceps','Tríceps'];let state=loadState()||{meso:'Mesociclo 1 (Sem 1–4)',split:'5 días',day:'D1 – Cuádriceps',week:'S1',data:{},prev:80,now:85,notes:[false,false,false,false]};function loadState(){try{return JSON.parse(window.localStorage.getItem('nay-demo-v1')||'null')}catch(e){return null}}function key(){return [state.meso,state.split,state.day,state.week].join('|')}function rows(){return state.data[key()]||base.map(r=>[...r])}function save(){try{window.localStorage.setItem('nay-demo-v1',JSON.stringify(state))}catch(e){/* Private/local file viewers may block storage; app remains usable. */}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function repsNum(v){let a=String(v).match(/\d+/);return a?+a[0]:0}function volume(r){return (+r[1]||0)*repsNum(r[2])*(+r[3]||0)}function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${icons[i]} &nbsp; ${t}</button>`).join('');document.getElementById('main').innerHTML=tab==='Rutinas'?routine():other();if(tab==='Rutinas')refresh()}function sel(field,options){return `<div><label>${{meso:'Mesociclo',split:'Split',day:'Día',week:'Semana'}[field]}</label><select onchange="state.${field}=this.value;save();render()">${options.map(o=>`<option ${state[field]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function routine(){let r=rows();return `<section class="filters">${sel('meso',['Mesociclo 1 (Sem 1–4)','Mesociclo 2 (Sem 5–8)','Mesociclo 3 (Sem 9–12)'])}${sel('split',['5 días','4 días','3 días','6 días'])}${sel('day',['D1 – Cuádriceps','D2 – Torso','D3 – Empujes','D4 – Femoral','D5 – Jalones'])}${sel('week',['S1','S2','S3','S4'])}<div class="summary"><small>VOLUMEN DEL DÍA</small><span id="summary">—</span></div></section><div class="layout"><section><div class="panel"><h2>${esc(state.day)}</h2><div class="scroll"><table><thead><tr><th>N°</th><th>Ejercicio</th><th>Series</th><th>Reps</th><th>Peso (kg)</th><th>Grupo muscular</th><th>Tonelaje est. (kg)</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td>${x.slice(0,5).map((v,j)=>`<td>${j===4?`<select onchange="edit(${i},${j},this.value)">${groups.map(g=>`<option ${g===v?'selected':''}>${g}</option>`).join('')}</select>`:`<input aria-label="${['Ejercicio','Series','Repeticiones','Peso'][j]}" class="${j===0?'exercise':''}" value="${esc(v)}" onchange="edit(${i},${j},this.value)">`}</td>`).join('')}<td class="v" data-row="${i}">${volume(x).toLocaleString('es-PE')}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">TOTAL</td><td id="series"></td><td id="reps"></td><td>—</td><td>—</td><td id="tonnage"></td></tr></tfoot></table></div><button class="add" onclick="addRow()">+ Añadir ejercicio</button></div><div class="bottom"><div class="panel"><h2>Notas del día</h2><div class="notes">${['Mantener técnica y rango completo.','Descanso: 1’30” – 2’00”.','Priorizar la progresión de cargas.','Registrar RPE (esfuerzo percibido).'].map((t,i)=>`<label><input type="checkbox" ${state.notes[i]?'checked':''} onchange="state.notes[${i}]=this.checked;save()"> ${t}</label>`).join('')}</div></div><div class="panel"><h2>Control de progresión</h2><div class="progress"><label>Peso anterior (kg)<input type="number" value="${state.prev}" onchange="state.prev=+this.value;save();refresh()"></label><label>Peso actual (kg)<input type="number" value="${state.now}" onchange="state.now=+this.value;save();refresh()"></label><label>Variación <strong id="delta"></strong></label><label>% Incremento <strong id="pct"></strong></label></div></div></div></section><aside><div class="panel"><h2>Series por grupo muscular (semana · registros disponibles)</h2><div class="bars" id="bars"></div></div><div class="panel"><h2>Progresión – Sentadilla Hack</h2><div class="chart"><svg viewBox="0 0 440 210" role="img" aria-label="Gráfico de ejemplo de progresión de cargas"><line x1="40" y1="175" x2="420" y2="175" stroke="#999"/><line x1="40" y1="45" x2="40" y2="175" stroke="#999"/>${[60,70,80,90].map(v=>`<g><line x1="40" y1="${175-(v-60)*3.4}" x2="420" y2="${175-(v-60)*3.4}" stroke="#eee"/><text x="8" y="${180-(v-60)*3.4}" font-size="12">${v}</text></g>`).join('')}<polyline fill="none" stroke="#e00810" stroke-width="4" points="80,141 180,124 280,107 380,90"/>${[70,75,80,85].map((v,i)=>`<g><circle cx="${80+i*100}" cy="${141-i*17}" r="5" fill="white" stroke="#e00810" stroke-width="3"/><text x="${67+i*100}" y="${126-i*17}" font-size="13" font-weight="bold">${v} kg</text><text x="${74+i*100}" y="194" font-size="12">S${i+1}</text></g>`).join('')}</svg><div class="muted">Curva ilustrativa. El historial real se conectará en una fase posterior.</div></div></div></aside></div>`}function refresh(){let r=rows(),s=r.reduce((a,x)=>a+(+x[1]||0),0),re=r.reduce((a,x)=>a+(+x[1]||0)*repsNum(x[2]),0),v=r.reduce((a,x)=>a+volume(x),0);document.getElementById('summary').textContent=`${s} series  |  ${re} reps estimadas  |  ${v.toLocaleString('es-PE')} kg estimados`;document.getElementById('series').textContent=s;document.getElementById('reps').textContent=re;document.getElementById('tonnage').textContent=v.toLocaleString('es-PE');document.getElementById('delta').textContent=`${(state.now-state.prev)>=0?'+':''}${state.now-state.prev} kg`;document.getElementById('pct').textContent=state.prev?`${((state.now/state.prev-1)*100)>=0?'+':''}${((state.now/state.prev-1)*100).toFixed(2)} %`:'—';let weekRows=[];for(let d of ['D1 – Cuádriceps','D2 – Torso','D3 – Empujes','D4 – Femoral','D5 – Jalones']){let k=[state.meso,state.split,d,state.week].join('|');if(state.data[k])weekRows.push(...state.data[k]);else if(d==='D1 – Cuádriceps')weekRows.push(...base)}let vals=groups.map(g=>weekRows.filter(x=>x[4]===g).reduce((a,x)=>a+(+x[1]||0),0)),max=Math.max(...vals,1);document.getElementById('bars').innerHTML=groups.map((g,i)=>`<div class="bar"><span>${g}</span><div class="track"><div class="fill" style="width:${vals[i]/max*100}%"></div></div><b>${vals[i]}</b></div>`).join('')}function edit(i,j,v){let r=rows();r[i][j]=j===1||j===3?Number(v)||0:v;state.data[key()]=r;save();render()}function addRow(){let r=rows();r.push(['Nuevo ejercicio',3,'8–12',0,'Cuádriceps']);state.data[key()]=r;save();render()}function other(){let content={Inicio:'Vista general de la planificación y métricas de tus clientes.',Progresión:'Historial de cargas, repeticiones, RPE y tendencias por ejercicio.',Volumen:'Series semanales por grupo muscular y tonelaje por sesión.',Planificación:'Mesociclos, distribución de splits y calendario de entrenamiento.',Evaluación:'Medidas corporales, objetivos y evolución del cliente.',Configuración:'Identidad NAY, ejercicios y parámetros de la aplicación.'};return `<div class="panel"><h2>${tab}</h2><div class="placeholder"><p>${content[tab]}</p><p class="muted">Módulo preparado para desarrollo en la siguiente fase. El módulo Rutinas es interactivo en esta versión.</p><button onclick="tab='Rutinas';render()">Abrir Rutinas</button></div></div>`}render();
</script></body></html>
